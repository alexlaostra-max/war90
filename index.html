<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="app-ver" content="99193992b1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Передел</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15121a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Передел">
<script>if (/tgWebApp/.test(location.hash + location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=Russo+One&display=swap">
<link rel="stylesheet" href="css/style.css?v=99193992b1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>Передел</b><span id="date"></span></div>
    <div id="apm" aria-label="Ходы в этом месяце"></div>
    <div id="stats"></div>
    <button id="music" class="btn" aria-pressed="false" title="Включить музыку"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><ellipse cx="6.4" cy="17.6" rx="3.2" ry="2.5"/><ellipse cx="17.4" cy="15.2" rx="3.2" ry="2.5"/></svg><span>Музыка</span></button>
    <button id="mnext" class="btn off" disabled aria-hidden="true" aria-label="Следующий трек" title="Следующий трек"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/><rect x="20" y="5.5" width="2" height="13" rx=".5"/></svg></button>
    <button id="sfx" class="btn" aria-pressed="true" title="Звуки"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button id="end" class="btn primary">Конец месяца</button>
  </header>
  <div id="bar"><nav id="menu" aria-label="Разделы"></nav><div id="ap" aria-label="Ходы в этом месяце"></div></div>
  <div id="strip"><div id="perks" aria-label="Что дают точки империи"></div></div>
  <div id="specbar" hidden></div>
  <main id="main">
    <section id="stage" aria-label="Раздел">
      <div id="org"></div>
      <div id="mapview" hidden>
        <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="zoom"><button data-z="1" aria-label="Приблизить">+</button><button data-z="-1" aria-label="Отдалить">−</button><button data-z="0" aria-label="Вся карта">◎</button></div>
        <button id="mylist" class="btn sm" data-a="dlist">Мои районы</button>
        <button id="maphelp" data-a="tip" data-k="map" title="Как брать районы" aria-label="Как брать районы">?</button>
        <div id="maptip" hidden></div>
        <p id="legend"><span><i class="lg mine"></i>твои</span><span><i class="lg target"></i>можно напасть</span><span><i class="lg ent"></i>предприятие</span></p>
      </div>
      <div id="page" hidden></div>
    </section>
    <aside id="side"><div id="sheethead"><i class="grab" aria-hidden="true"></i><b id="sheettitle"></b><button class="xclose" data-a="sheetclose" aria-label="Закрыть">×</button></div><div id="pane"></div></aside>
  </main>
  <nav id="tabbar" aria-label="Разделы"></nav>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<script src="js/data.js?v=99193992b1"></script>
<script src="js/events.js?v=99193992b1"></script>
<script src="js/geo.js?v=99193992b1"></script>
<script src="js/engine.js?v=99193992b1"></script>
<script src="js/art.js?v=99193992b1"></script>
<script src="js/net.js?v=99193992b1"></script>
<script src="js/music.js?v=99193992b1"></script>
<script src="js/sfx.js?v=99193992b1"></script>
<script src="js/ui.js?v=99193992b1"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
